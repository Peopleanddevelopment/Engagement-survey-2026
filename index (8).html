<script>
(async () => {
  'use strict';
  try{
  const encoded=document.getElementById('embedded-data').textContent.trim();
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const DATA=JSON.parse(await new Response(stream).text());
  const state=JSON.parse(JSON.stringify(window.__EXEC_STATE__));
  const dims=[['gender','Genere'],['age','Fascia di età'],['tenure','Anzianità'],['workplace','Sede di lavoro'],['family','Famiglia professionale'],['brand','Brand'],['ftpt','Orario FT–PT'],['contract','Tipo contratto'],['position','Posizione'],['store','Negozio']];
  const filterDims=[['year','Anno'],...dims];
  const dimLabel=Object.fromEntries(dims);
  const titles={overview:'Sintesi',trend:'Andamento',drivers:'Driver 2026',segments:'Segmenti',detail:'Analisi dettagliata',method:'Note metodologiche'};
  const strictCommon=DATA.sets.common.filter(q=>q!=='g10');
  const strictExtended=DATA.sets.extended.filter(q=>q!=='g10');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
  const signed=(v,d=2)=>Number.isFinite(v)?`${v>0?'+':''}${fmt(v,d)}`:'—';
  const pct=v=>Number.isFinite(v)?`${v>0?'+':''}${v.toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})}%`:'—';
  const qLabel=q=>DATA.questions[q]?.label||q;
  function filteredRows(years=['2022','2024','2026'],respectYear=true){const allowed=respectYear&&state.filters.year?[state.filters.year]:years;return DATA.records.filter(r=>allowed.includes(r.y)&&dims.every(([k])=>!state.filters[k]||r.d[k]===state.filters[k]));}
  function byYear(rows,y){return rows.filter(r=>r.y===y)}
  function mean(rows,qs){let sum=0,n=0;for(const r of rows)for(const q of qs){const v=r.q[q];if(Number.isFinite(v)){sum+=v;n++}}return n?{value:sum/n,n}: {value:null,n:0}}
  function pearson(rows,a,b){let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;for(const r of rows){const x=r.q[a],y=r.q[b];if(!Number.isFinite(x)||!Number.isFinite(y))continue;n++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}const den=Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));return {r:n>2&&den?(n*sxy-sx*sy)/den:null,n}}
  function enps(rows){const vals=rows.map(r=>r.q.enps).filter(Number.isFinite);if(!vals.length)return null;return 100*(vals.filter(v=>v>=9).length-vals.filter(v=>v<=6).length)/vals.length}
  function deltaClass(v){return v>0.04?'delta-pos':v<-.04?'delta-neg':''}
  function baseOK(rows){return rows.length>=2}
  function noBase(){return `<div class="empty"><strong>Base non sufficiente</strong><br>Servono almeno 2 rispondenti nel perimetro selezionato.</div>`}
  function activeSummary(){const act=filterDims.filter(([k])=>state.filters[k]).map(([k,l])=>`${l}: ${state.filters[k]}`);const printSummary=act.length?`Filtri applicati · ${act.join(' · ')}`:'Vista generale · nessun filtro applicato';document.getElementById('activeFilters').innerHTML=act.length?act.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):`<div class="general-view-banner"><div><strong>Vista generale</strong><span>Stai visualizzando i dati complessivi. Usa i filtri per approfondire anno, Brand, sede, età o anzianità.</span></div><button class="inline-filter" type="button">Scegli i filtri</button></div>`;document.querySelectorAll('.page').forEach(page=>page.dataset.printFilters=printSummary);document.getElementById('filterCount').textContent=act.length?`(${act.length})`:'';document.querySelector('.inline-filter')?.addEventListener('click',openFilters)}
  function kpi(label,value,note,cls=''){return `<div class="kpi"><div class="kpi-label">${esc(label)}</div><div class="kpi-value ${cls}">${value}</div><div class="kpi-note">${esc(note)}</div></div>`}
  function questionStats(rows24,rows26,qs=strictExtended){return qs.map(q=>{const a=mean(rows24,[q]).value,b=mean(rows26,[q]).value;return {q,a,b,delta:Number.isFinite(a)&&Number.isFinite(b)?b-a:null}})}
  function trendChart(values){return `<div class="trend">${values.map((x,i)=>`<div class="trend-col ${i===values.length-1?'current':''}"><div class="trend-value">${fmt(x.value)}</div><div class="trend-bar" style="height:${Math.max(12,(x.value||0)*19)}px"></div><div class="trend-year">${x.year}</div></div>`).join('')}</div>`}
  function rank(items,{value='value',signal=false,max=10}={}){return `<div class="rank-list">${items.map((x,i)=>`<div class="rank-item"><div class="rank-label">${esc(x.label)}</div><div class="track"><div class="fill ${(signal&&i===0)?'signal':''}" style="width:${Math.max(0,Math.min(100,(x[value]||0)/max*100))}%"></div></div><div class="rank-value">${fmt(x[value])}</div></div>`).join('')}</div>`}
  function renderOverview(){
    const allRows=filteredRows(['2022','2024','2026'],false),focusYear=state.filters.year||'2026',previousYear=focusYear==='2026'?'2024':focusYear==='2024'?'2022':null;
    const focus=byYear(allRows,focusYear),previous=previousYear?byYear(allRows,previousYear):[];
    if(!baseOK(focus))return document.getElementById('page-overview').innerHTML=noBase();
    const focusMean=mean(focus,strictCommon).value,previousMean=baseOK(previous)?mean(previous,strictCommon).value:null,delta=Number.isFinite(previousMean)?focusMean-previousMean:null;
    const responseDelta=baseOK(previous)?(focus.length/previous.length-1)*100:null,sat=mean(focus,['sat']).value,e=enps(focus);
    const stats=strictCommon.map(q=>{const b=mean(focus,[q]).value,a=baseOK(previous)?mean(previous,[q]).value:null;return {q,a,b,delta:Number.isFinite(a)&&Number.isFinite(b)?b-a:null}}).filter(x=>Number.isFinite(x.b));
    const low=[...stats].sort((a,b)=>a.b-b.b)[0],high=[...stats].sort((a,b)=>b.b-a.b)[0],drop=[...stats].filter(x=>Number.isFinite(x.delta)).sort((a,b)=>a.delta-b.delta)[0];
    const selectedBrand=state.filters.brand,selectedBrandScore=selectedBrand?mean(focus,strictExtended).value:null;
    const brandInsight=selectedBrand?`<div class="insight-line"><div class="insight-tag">Brand selezionato</div><div class="insight-text">${esc(selectedBrand)}</div><div class="insight-number">${fmt(selectedBrandScore)}</div></div>`:`<div class="insight-line"><div class="insight-tag">Approfondisci un Brand</div><div class="insight-text"><button class="brand-filter-cta" type="button">Seleziona un Brand nei filtri</button></div><div class="insight-number">—</div></div>`;
    const direction=Number.isFinite(delta)?(delta<0?'scende':'sale'):null;
    const signalTitle=direction?`La media delle 11 domande comuni ${direction} di ${fmt(Math.abs(delta))} punti dal ${previousYear}.`:`La media delle 11 domande comuni nel ${focusYear} è ${fmt(focusMean)}.`;
    const yearsToShow=(state.filters.year?[previousYear,focusYear]:['2022','2024','2026']).filter(Boolean).map(year=>({year,value:mean(byYear(allRows,year),strictCommon).value})).filter(x=>Number.isFinite(x.value));
    document.getElementById('page-overview').innerHTML=`
      <h1 class="page-title">${state.filters.year?`La fotografia dell’engagement nel ${focusYear}.`:'L’engagement scende, mentre la partecipazione cresce.'}</h1>
      <section class="executive-signal"><div class="signal-copy"><div class="eyebrow">Segnale principale</div><h3>${signalTitle}</h3><p>La media considera le 11 domande formulate nello stesso modo negli anni messi a confronto.</p></div><div class="signal-score"><div class="score">${fmt(focusMean)}</div><div class="delta">${Number.isFinite(delta)?`${signed(delta)} vs ${previousYear}`:`Anno ${focusYear}`}</div><small>Media di 11 domande comuni · scala 0–10</small></div></section>
      <div class="kpi-row">${kpi(`Rispondenti ${focusYear}`,focus.length.toLocaleString('it-IT'),Number.isFinite(responseDelta)?`${pct(responseDelta)} rispetto al ${previousYear}`:'Base selezionata')}${kpi('Soddisfazione generale',fmt(sat),`Media ${focusYear} · scala 0–10`)}${kpi('eNPS',signed(e,0),'Promotori meno detrattori')}${kpi('Area più debole',fmt(low?.b),low?qLabel(low.q):'—')}</div>
      <div class="grid-2"><article class="panel"><div class="panel-head"><div><h3>Andamento del punteggio</h3><p class="caption">Media delle 11 domande comuni.</p></div></div>${trendChart(yearsToShow)}</article>
      <article class="panel"><div class="panel-head"><div><h3>Le tre cose da sapere</h3><p class="caption">Elementi utili per orientare l’approfondimento.</p></div></div><div class="insight-list"><div class="insight-line"><div class="insight-tag">Punto di forza</div><div class="insight-text">${high?esc(qLabel(high.q)):'—'}</div><div class="insight-number">${fmt(high?.b)}</div></div><div class="insight-line"><div class="insight-tag">${drop?'Calo maggiore':'Area più debole'}</div><div class="insight-text">${esc(qLabel((drop||low)?.q||''))}</div><div class="insight-number delta-neg">${drop?signed(drop.delta):fmt(low?.b)}</div></div>${brandInsight}</div><div class="callout"><strong>Implicazione.</strong> Usa i filtri per verificare se il segnale è diffuso o concentrato in specifici gruppi.</div></article></div>`;
    document.querySelector('.brand-filter-cta')?.addEventListener('click',openFilters);
  }
  function renderTrend(){
    const allRows=filteredRows(['2022','2024','2026'],false),focusYear=state.filters.year||'2026',previousYear=focusYear==='2026'?'2024':focusYear==='2024'?'2022':null;
    const focus=byYear(allRows,focusYear),previous=previousYear?byYear(allRows,previousYear):[];
    if(!baseOK(focus))return document.getElementById('page-trend').innerHTML=noBase();
    const displayYears=(state.filters.year?[previousYear,focusYear]:['2022','2024','2026']).filter(Boolean);
    const values=displayYears.map(year=>({year,value:mean(byYear(allRows,year),strictCommon).value})).filter(x=>Number.isFinite(x.value));
    const stats=baseOK(previous)?questionStats(previous,focus,strictCommon).sort((a,b)=>a.delta-b.delta):[];
    document.getElementById('page-trend').innerHTML=`<div class="eyebrow">Evoluzione dei risultati</div><h1 class="page-title">${state.filters.year?`Il ${focusYear} a confronto con ${previousYear||'il periodo disponibile'}.`:'Il calo accelera nel 2026.'}</h1><p class="lead">Il confronto utilizza le 11 domande rimaste identiche nel tempo.</p><div class="grid-2"><article class="panel"><h3>Media delle 11 domande comuni</h3><p class="caption">Media su scala 0–10.</p>${trendChart(values)}</article><article class="panel"><h3>Cosa cambia${previousYear?` dal ${previousYear}`:''}</h3><p class="caption">Domande ordinate per variazione.</p>${stats.length?`<div class="insight-list">${stats.slice(0,5).map(x=>`<div class="insight-line"><div class="insight-tag">${esc(x.q.toUpperCase())}</div><div class="insight-text">${esc(qLabel(x.q))}</div><div class="insight-number ${deltaClass(x.delta)}">${signed(x.delta)}</div></div>`).join('')}</div>`:'<div class="empty">Non è disponibile un anno precedente confrontabile.</div>'}</article></div>${stats.length?`<article class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Tutte le variazioni ${previousYear}–${focusYear}</h3><p class="caption">Confronto sulle domande formulate nello stesso modo.</p></div></div>${questionTable(stats,previousYear,focusYear)}</article>`:''}`;
  }
  function questionTable(stats,fromYear='2024',toYear='2026'){return `<div class="table-wrap"><table><thead><tr><th>Domanda</th><th class="num">${fromYear}</th><th class="num">${toYear}</th><th class="num">Δ</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${esc(qLabel(x.q))}</td><td class="num">${fmt(x.a)}</td><td class="num">${fmt(x.b)}</td><td class="num ${deltaClass(x.delta)}"><strong>${signed(x.delta)}</strong></td></tr>`).join('')}</tbody></table></div>`}
  function corrStrength(value){return value>=.60?'corr-good':value<.40?'corr-bad':'corr-mid'}
  function renderDrivers(){
    if(state.filters.year&&state.filters.year!=='2026')return document.getElementById('page-drivers').innerHTML=`<div class="eyebrow">Associazioni 2026</div><h1 class="page-title">I driver sono disponibili per il 2026.</h1><div class="empty">Nel filtro Anno seleziona 2026 oppure Tutti.</div>`;
    const rows=byYear(filteredRows(['2026'],false),'2026');
    if(!baseOK(rows))return document.getElementById('page-drivers').innerHTML=noBase();
    const target=state.corrTarget;
    const data=strictExtended.map(q=>({q,label:qLabel(q),sat:pearson(rows,q,'sat'),enps:pearson(rows,q,'enps')})).filter(x=>Number.isFinite(x[target].r)).sort((a,b)=>b[target].r-a[target].r);
    document.getElementById('page-drivers').innerHTML=`<div class="eyebrow">Correlazioni · 2026</div><h1 class="page-title">Quali aspetti sono più associati all’esperienza complessiva.</h1><p class="lead">Sono mostrate le correlazioni di Pearson con soddisfazione generale ed eNPS. Una correlazione descrive un’associazione, non dimostra un rapporto di causa-effetto.</p><article class="panel"><div class="controls"><div class="control"><label for="corrTarget">Ordina per</label><select id="corrTarget"><option value="enps" ${target==='enps'?'selected':''}>Propensione a raccomandare (eNPS)</option><option value="sat" ${target==='sat'?'selected':''}>Soddisfazione generale</option></select></div></div><div class="corr-legend"><span class="corr-key corr-good">Molto bene · ≥ 0,60</span><span class="corr-key corr-mid">Intermedio · 0,40–0,59</span><span class="corr-key corr-bad">Molto male · &lt; 0,40</span></div><div class="driver-list">${data.map((x,i)=>{const selected=x[target];return `<div class="driver-row"><div><strong>${i+1}. ${esc(x.label)}</strong><div class="caption">n = ${selected.n.toLocaleString('it-IT')} risposte valide</div></div><div class="corr-pair"><span class="corr-badge ${corrStrength(x.sat.r)}">Sod. ${fmt(x.sat.r,3)}</span><span class="corr-badge ${corrStrength(x.enps.r)}">eNPS ${fmt(x.enps.r,3)}</span></div><div class="track"><div class="fill ${corrStrength(selected.r)}" style="width:${Math.max(0,selected.r)*100}%"></div></div><div class="driver-r">${fmt(selected.r,3)}</div></div>`}).join('')}</div></article><div class="callout"><strong>Come leggerle.</strong> Più il coefficiente si avvicina a 1, più le due risposte tendono a muoversi insieme. La lettura va sempre integrata con i punteggi medi e con i segmenti.</div>`;
    document.getElementById('corrTarget').onchange=e=>{state.corrTarget=e.target.value;renderDrivers()};
  }
  function segmentStats(rows,dim,qs){const keys=[...new Set(rows.map(r=>r.d[dim]||'Non disponibile'))];return keys.map(key=>{const a=rows.filter(r=>r.y==='2024'&&(r.d[dim]||'Non disponibile')===key),b=rows.filter(r=>r.y==='2026'&&(r.d[dim]||'Non disponibile')===key),m24=mean(a,qs).value,m26=mean(b,qs).value;return {key,n24:a.length,n26:b.length,m24,m26,delta:Number.isFinite(m24)&&Number.isFinite(m26)?m26-m24:null}})}
  function renderSegments(){
    const dim=state.segment;
    if(state.filters.year){
      const year=state.filters.year,rows=filteredRows([year]);
      if(!baseOK(rows))return document.getElementById('page-segments').innerHTML=noBase();
      const data=[...new Set(rows.map(r=>r.d[dim]||'Non disponibile'))].map(key=>{const bucket=rows.filter(r=>(r.d[dim]||'Non disponibile')===key);return {key,n:bucket.length,value:mean(bucket,strictCommon).value}}).filter(x=>x.n>=2&&Number.isFinite(x.value)).sort((a,b)=>a.value-b.value);
      document.getElementById('page-segments').innerHTML=`<div class="eyebrow">Dove concentrare l’attenzione</div><h1 class="page-title">Segmenti · ${year}</h1><p class="lead">La vista mostra il punteggio dell’anno selezionato. Le basi inferiori a 2 persone sono escluse.</p><article class="panel"><div class="controls"><div class="control"><label for="segmentDim">Segmento</label><select id="segmentDim">${dims.slice(0,8).map(([k,l])=>`<option value="${k}" ${k===dim?'selected':''}>${esc(l)}</option>`).join('')}</select></div></div>${segmentTableSingle(data,year)}</article>`;
    }else{
      const rows=filteredRows(['2024','2026']),data=segmentStats(rows,dim,strictExtended).filter(x=>x.n24>=2&&x.n26>=2).sort((a,b)=>a.m26-b.m26);
      document.getElementById('page-segments').innerHTML=`<div class="eyebrow">Dove concentrare l’attenzione</div><h1 class="page-title">I segmenti trasformano il dato in una domanda operativa.</h1><p class="lead">Il confronto mostra sia il livello 2026 sia la direzione rispetto al 2024. Le basi inferiori a 2 persone per anno sono escluse.</p><article class="panel"><div class="controls"><div class="control"><label for="segmentDim">Segmento</label><select id="segmentDim">${dims.slice(0,8).map(([k,l])=>`<option value="${k}" ${k===dim?'selected':''}>${esc(l)}</option>`).join('')}</select></div></div>${segmentTable(data)}</article>`;
    }
    document.getElementById('segmentDim').onchange=e=>{state.segment=e.target.value;renderSegments()};
  }
  function segmentTable(data){if(!data.length)return '<div class="empty">Nessun segmento con una base sufficiente in entrambi gli anni.</div>';return `<div class="table-wrap"><table><thead><tr><th>Segmento</th><th class="num">n 2024</th><th class="num">n 2026</th><th class="num">2024</th><th class="num">2026</th><th class="num">Variazione</th></tr></thead><tbody>${data.map(x=>`<tr><td><span class="status-dot ${x.delta<-.05?'down':x.delta>.05?'up':'flat'}"></span><strong>${esc(x.key)}</strong></td><td class="num">${x.n24.toLocaleString('it-IT')}</td><td class="num">${x.n26.toLocaleString('it-IT')}</td><td class="num">${fmt(x.m24)}</td><td class="num"><strong>${fmt(x.m26)}</strong></td><td class="num ${deltaClass(x.delta)}"><strong>${signed(x.delta)}</strong></td></tr>`).join('')}</tbody></table></div>`}
  function segmentTableSingle(data,year){if(!data.length)return '<div class="empty">Nessun segmento con almeno 2 rispondenti.</div>';return `<div class="table-wrap"><table><thead><tr><th>Segmento</th><th class="num">n</th><th class="num">Punteggio ${year}</th></tr></thead><tbody>${data.map(x=>`<tr><td><strong>${esc(x.key)}</strong></td><td class="num">${x.n.toLocaleString('it-IT')}</td><td class="num"><strong>${fmt(x.value)}</strong></td></tr>`).join('')}</tbody></table></div>`}
  function renderDetail(){const rows=filteredRows(),mode=state.detailMode,q=state.detailQuestion;const qOptions=[['_index','Media delle 11 domande comuni'],...DATA.sets.all2026.map(k=>[k,qLabel(k)])];document.getElementById('page-detail').innerHTML=`<div class="eyebrow">Explorer</div><h1 class="page-title">Dal segnale al dettaglio.</h1><p class="lead">Scegli un indicatore e un tipo di lettura. Questa sezione è pensata per approfondire quanto emerso nella sintesi.</p><article class="panel"><div class="controls"><div class="control"><label for="detailMode">Vista</label><select id="detailMode"><option value="mean" ${mode==='mean'?'selected':''}>Punteggio medio per anno</option><option value="distribution" ${mode==='distribution'?'selected':''}>Distribuzione delle risposte</option><option value="segment" ${mode==='segment'?'selected':''}>Confronto per segmento</option></select></div><div class="control"><label for="detailQuestion">Indicatore</label><select id="detailQuestion">${qOptions.map(([k,l])=>`<option value="${k}" ${q===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>${mode==='segment'?`<div class="control"><label for="detailSegment">Segmento</label><select id="detailSegment">${dims.slice(0,8).map(([k,l])=>`<option value="${k}" ${state.segment===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`:''}</div><div id="detailBody">${detailBody(rows,mode,q)}</div></article>`;document.getElementById('detailMode').onchange=e=>{state.detailMode=e.target.value;renderDetail()};document.getElementById('detailQuestion').onchange=e=>{state.detailQuestion=e.target.value;renderDetail()};const ds=document.getElementById('detailSegment');if(ds)ds.onchange=e=>{state.segment=e.target.value;renderDetail()}}
  function detailBody(rows,mode,q){
    const qs=q==='_index'?strictCommon:[q];
    if(mode==='segment'){
      if(state.filters.year){const year=state.filters.year,data=[...new Set(rows.map(r=>r.d[state.segment]||'Non disponibile'))].map(key=>{const bucket=rows.filter(r=>(r.d[state.segment]||'Non disponibile')===key);return {key,n:bucket.length,value:mean(bucket,qs).value}}).filter(x=>x.n>=2&&Number.isFinite(x.value)).sort((a,b)=>a.value-b.value);return segmentTableSingle(data,year)}
      return segmentTable(segmentStats(rows,state.segment,q==='_index'?strictExtended:qs).filter(x=>x.n24>=2&&x.n26>=2).sort((a,b)=>a.m26-b.m26));
    }
    if(mode==='distribution'){if(q==='_index'||q==='enps')return '<div class="empty">Scegli una singola domanda su scala di accordo per vedere la distribuzione.</div>';return distribution(rows,q)}
    const years=(state.filters.year?[state.filters.year]:['2022','2024','2026']).map(year=>({year,value:mean(byYear(rows,year),qs).value,n:byYear(rows,year).length})).filter(x=>Number.isFinite(x.value));
    return `${trendChart(years)}<p class="note">Base rispondenti: ${years.map(x=>`${x.year}: ${x.n.toLocaleString('it-IT')}`).join(' · ')}</p>`;
  }
  function distribution(rows,q){const scores=[10,7.5,5,2.5,0],labels=q==='sat'?['Molto soddisfatto','Abbastanza soddisfatto','Né soddisfatto né insoddisfatto','Abbastanza insoddisfatto','Molto insoddisfatto']:['Molto d’accordo','Abbastanza d’accordo','Neutro','Abbastanza in disaccordo','Molto in disaccordo'];return `<div class="table-wrap"><table><thead><tr><th>Risposta</th>${['2022','2024','2026'].map(y=>`<th class="num">${y}</th>`).join('')}</tr></thead><tbody>${scores.map((s,i)=>`<tr><td>${labels[i]}</td>${['2022','2024','2026'].map(y=>{const vals=byYear(rows,y).map(r=>r.q[q]).filter(Number.isFinite),p=vals.length?vals.filter(v=>v===s).length/vals.length*100:null;return `<td class="num">${Number.isFinite(p)?fmt(p,1)+'%':'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
  function renderMethod(){document.getElementById('page-method').innerHTML=`<div class="eyebrow">00 · Note metodologiche</div><h1 class="page-title">Metodo e guida alla lettura.</h1><p class="lead">Questa sezione chiarisce da dove arrivano gli indicatori, quali confronti sono corretti e come orientarsi nel file.</p><div class="method-grid"><article class="method-block"><h3>Metodo Gallup Q12</h3><p>Il questionario riprende la struttura del metodo Gallup Q12: 12 domande che esplorano aspettative, risorse, riconoscimento, relazione, crescita e senso di appartenenza. Nel trend vengono usate 11 domande rimaste identiche; la domanda sull’amicizia al lavoro è esclusa perché riformulata nel 2026.</p></article><article class="method-block"><h3>Come leggere il file</h3><p>Parti dalla Sintesi, verifica l’Andamento, usa Driver e correlazioni per individuare le associazioni più forti, quindi approfondisci Segmenti e Analisi dettagliata. I filtri si applicano a tutte le viste.</p></article><article class="method-block"><h3>Base minima: 2</h3><p>Un risultato viene mostrato con almeno 2 rispondenti nel perimetro selezionato. Basi molto piccole richiedono cautela: il dato descrive il gruppo, ma può essere instabile.</p></article><article class="method-block"><h3>Correlazioni</h3><p>Il coefficiente di Pearson varia da −1 a +1 e misura quanto due risposte si muovono insieme. Non dimostra che un fattore causi l’altro.</p></article></div><article class="panel" style="margin-top:16px"><h3>Perimetro dei dati</h3><div class="insight-list"><div class="insight-line"><div class="insight-tag">2022</div><div class="insight-text">Rispondenti inclusi</div><div class="insight-number">${DATA.quality.records['2022'].toLocaleString('it-IT')}</div></div><div class="insight-line"><div class="insight-tag">2024</div><div class="insight-text">Rispondenti inclusi</div><div class="insight-number">${DATA.quality.records['2024'].toLocaleString('it-IT')}</div></div><div class="insight-line"><div class="insight-tag">2026</div><div class="insight-text">Rispondenti inclusi</div><div class="insight-number">${DATA.quality.records['2026'].toLocaleString('it-IT')}</div></div></div></article>`}
  function populateFilters(){const host=document.getElementById('filterGrid');host.innerHTML=filterDims.map(([k,l])=>{const vals=k==='year'?['2022','2024','2026']:[...new Set(DATA.records.map(r=>r.d[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));return `<div><label for="f-${k}">${esc(l)}</label><select id="f-${k}" data-filter="${k}"><option value="">Tutti</option>${vals.map(v=>`<option value="${esc(v)}" ${state.filters[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}).join('')}
  function renderAll(){activeSummary();renderOverview();renderTrend();renderDrivers();renderSegments();renderDetail();renderMethod()}
  function setPage(page){state.page=page;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${page}`));document.querySelectorAll('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('topTitle').textContent=titles[page];window.scrollTo({top:0,behavior:'smooth'})}
  function printDocument(mode){document.body.classList.remove('print-current','print-all');document.body.classList.add(mode);requestAnimationFrame(()=>window.print())}
  window.addEventListener('afterprint',()=>document.body.classList.remove('print-current','print-all'));
  document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
  document.querySelector('[data-action="print-all"]').onclick=()=>printDocument('print-all');
  document.getElementById('printCurrentBtn').onclick=()=>printDocument('print-current');
  const backdrop=document.getElementById('filterBackdrop');function openFilters(){populateFilters();backdrop.classList.add('open')}document.getElementById('filterBtn').onclick=openFilters;document.getElementById('closeFilters').onclick=()=>backdrop.classList.remove('open');backdrop.onclick=e=>{if(e.target===backdrop)backdrop.classList.remove('open')};
  document.getElementById('resetFilters').onclick=()=>{filterDims.forEach(([k])=>state.filters[k]='');populateFilters()};document.getElementById('applyFilters').onclick=()=>{document.querySelectorAll('[data-filter]').forEach(s=>state.filters[s.dataset.filter]=s.value);backdrop.classList.remove('open');renderAll();setPage(state.page)};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')backdrop.classList.remove('open')});
  renderAll();setPage(state.page);
  }catch(error){
    console.error(error);
    document.body.innerHTML='<main style="max-width:720px;margin:12vh auto;padding:32px;font:16px/1.5 Arial,sans-serif;color:#25241f"><h1>Impossibile caricare la dashboard</h1><p>Aggiorna il browser oppure apri la pagina con una versione recente di Microsoft Edge, Chrome, Safari o Firefox.</p></main>';
  }
})();
</script>
</body>
</html>
